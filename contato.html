<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato · For Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="brand">
      <img src="./img/for travel.jpeg" alt="Logo For Travel: bússola, avião e mala de viagem">
    </div>

    <section>
      <h1>Fale com a For Travel</h1>
      <p class="lead">Precisa de ajuda com a sua viagem ou tem alguma dúvida? Nossa equipe está pronta para te atender.</p>

      <ul class="info">
        <li><b>E-mail</b><a href="mailto:contato@fortravel.com.br">contato@fortravel.com.br</a></li>
        <li><b>WhatsApp</b><a href="https://wa.me/5511900000000">( 11 ) 97874-9609</a></li>
        <li><b>Atendimento</b>Segunda a sexta, 9h às 18h</li>
      </ul>

      <form id="f">
        <label>Nome<input name="nome" required autocomplete="Coloque seu nome" placeholder="Coloque seu nome"></label>

        <label>Sobrenome<input name="sobrenome" required autocomplete="Coloque seu sobrenome" placeholder="Coloque seu sobrenome"> </label>

        <label>E-mail<input name="email" type="email" required autocomplete="Coloque seu e-mail" placeholder="Coloque seu e-mail"></label>

        <label>Telefone<input name="telefone" type="tel" required autocomplete="Coloque seu telefone" placeholder="Coloque seu telefone"></label>

        <div class="campo">
          <label>Estado</label>
          <select required>
            <option value="">Selecione o estado</option>
            <option>São Paulo</option>
            <option>Rio de Janeiro</option>
            <option>Minas Gerais</option>
            </select>
        </div>

        <label>Como podemos ajudar?<input name="assunto" type="text" required autocomplete="Coloque o assunto" placeholder="Qual seria o problema?"> </label>

        <label>Mensagem<textarea name="msg" required placeholder="Descreva sua solicitação"></textarea></label>

        <button type="submit">Enviar mensagem</button>
        <p class="ok" id="ok" role="status"></p>

      </form>



      <a class="insta" href="https://instagram.com/fortravel" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"
          aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.2" cy="6.8" r="1" fill="currentColor" stroke="none" />
        </svg>
        Siga a gente no Instagram: @fortravel
      </a>
    </section>
  </main>

  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var d = new FormData(e.target);
      var corpo = 'Nome: ' + d.get('nome') + '\nE-mail: ' + d.get('email') + '\n\n' + d.get('msg');
      location.href = 'mailto:contato@fortravel.com.br?subject=' +
        encodeURIComponent('Contato pelo site – ' + d.get('nome')) +
        '&body=' + encodeURIComponent(corpo);
      document.getElementById('ok').textContent = 'Abrindo seu aplicativo de e-mail para enviar a mensagem.';
    });
  </script>
</body>

</html>
